<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bẫy 05 – OTP</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#061a35;color:#fff}
.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;color:#101828;border-radius:20px;padding:24px;box-shadow:0 15px 50px #0006}
.badge{display:inline-block;background:#d71920;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800}
h1{font-size:31px;line-height:1.1;color:#092e62;margin:14px 0 7px}h2{color:#092e62}
p,li{line-height:1.5}.danger{background:#fff1f0;border-left:6px solid #d71920;padding:14px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin:18px 0}
.choice{background:#f4f7fb;border:2px solid #d7deea;border-radius:14px;padding:17px;cursor:pointer;font-weight:700;font-size:16px;text-align:left}
.choice:hover{border-color:#0867d8}.choice:disabled{opacity:.55;cursor:not-allowed}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;margin:5px}.primary{background:#0867d8;color:#fff}.red{background:#d71920;color:#fff}.gray{background:#e8edf3;color:#111}
.result{display:none;margin-top:18px;padding:18px;border-radius:16px;background:#eef6ff}.result.bad{background:#fff1f0}.result.good{background:#ecfdf3}
.big{font-size:25px;font-weight:900;color:#d71920}.good .big{color:#067647}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#0867d8;transition:.35s}
.score{font-weight:900;color:#092e62}.small{font-size:13px;color:#667085}
.fakebox,.email{border:1px solid #ccd5e0;border-radius:14px;padding:18px;background:#fff}.fakebox input{width:100%;padding:12px;margin:7px 0;border:1px solid #b8c2cf;border-radius:8px}
.mono{font-family:Consolas,monospace;background:#101828;color:#fff;padding:14px;border-radius:10px}
.phone{max-width:360px;margin:auto;background:#111;color:#fff;border-radius:30px;padding:16px}.screen{background:#f7f7f7;color:#111;border-radius:22px;padding:18px;min-height:330px}
.footer{text-align:center;color:#cbd8e8;font-size:13px;padding:15px}
.hero{text-align:center;padding:12px}.hero .shield{font-size:64px}.scorecard{font-size:38px;font-weight:900;color:#092e62;text-align:center}
a{text-decoration:none;color:inherit}@media(max-width:600px){h1{font-size:27px}.wrap{padding:9px}.card{padding:18px}}
</style></head><body><div class="wrap"><div class="card"><span class="badge">BẪY 05/10 • THỬ THÁCH</span><h1>OTP</h1><p>Không đọc mã xác thực cho người khác.</p>
<div class="progress"><div id="bar" class="bar"></div></div><div class="score">Điểm hiện tại: <span id="score">0</span>/10</div><div class='phone'><div class='screen'><h2>🔐 OTP</h2><p>Mã: <b>839271</b></p><p>Người gọi: “Đọc mã giúp tôi.”</p></div></div><div class='grid'><button class='choice' onclick='answer(false)'>A. Đọc OTP</button><button class='choice' onclick='answer(true)'>B. Từ chối và xác minh</button></div>
<div id="result" class="result"><div id="headline" class="big"></div><p><b>Bài học:</b> Không cung cấp OTP cho người gọi/nhắn tin.</p><br><button class="btn gray" onclick="location.reload()">↩ Thử lại</button><a href="index.html"><button class="btn primary">🏠 Bảng điểm</button></a></div></div><div class="footer">10 BẪY AN TOÀN THÔNG TIN • Thực hiện bởi Lan Phương - Công an phường B'Lao</div></div><script>
function answer(ok){let total=Number(localStorage.getItem("bayScore")||0)+(ok?1:0);localStorage.setItem("bayScore",total);document.querySelectorAll(".choice").forEach(b=>b.disabled=true);document.getElementById("score").textContent=total;document.getElementById("bar").style.width=(total*10)+"%";let r=document.getElementById("result");r.style.display="block";document.getElementById("headline").textContent=ok?"✅ BẠN ĐÃ NHẬN DIỆN ĐÚNG":"⚠️ BẠN VỪA DÍNH BẪY – ĐÂY LÀ BÀI HỌC";r.className="result "+(ok?"good":"bad")}
</script></body></html>
